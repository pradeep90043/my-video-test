name: Remotion Cloud Video Renderer

on:
  workflow_dispatch:
    inputs:
      project:
        description: "Project slug (e.g. stickman-demo, single-income-trap, or dynamic lv-* slug)"
        required: true
        default: "stickman-demo"
      bundle_url:
        description: "Optional URL to download project bundle (video.json + audio) if dynamically generated"
        required: false
        default: ""
      resolution:
        description: "Output resolution (720 or 1080, or 360 for fast draft)"
        required: true
        type: choice
        options:
          - "720"
          - "1080"
          - "360"
        default: "720"
      progress_url:
        description: "Optional URL the runner POSTs live frame progress to"
        required: false
        default: ""
      progress_token:
        description: "Per-job token for progress_url"
        required: false
        default: ""
      publish_url:
        description: "Optional dashboard URL the runner asks for a short-lived YouTube upload token (uses progress_token to identify the job)"
        required: false
        default: ""
      chunks:
        description: "Number of parallel runners to split the render across (1-16)"
        required: false
        default: "2"
      draft:
        description: "Draft mode (fast 360p review render, skips logo/branding)"
        type: boolean
        default: false
      no_branding:
        description: "Skip logo watermark overlay"
        type: boolean
        default: false

  repository_dispatch:
    types: [render_video]

concurrency:
  group: render-${{ github.event.inputs.project || github.event.client_payload.project }}
  cancel-in-progress: false

env:
  NODE_OPTIONS: "--dns-result-order=ipv4first"

jobs:
  # 1) Voiceover, audio mix and the composition's final audio track — done once.
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      project: ${{ steps.args.outputs.project }}
      render_flags: ${{ steps.args.outputs.render_flags }}
      progress_url: ${{ steps.args.outputs.progress_url }}
      progress_token: ${{ steps.args.outputs.progress_token }}
      publish_url: ${{ steps.args.outputs.publish_url }}
      chunks: ${{ steps.plan.outputs.chunks }}
      matrix: ${{ steps.plan.outputs.matrix }}
      audio_chunks: ${{ steps.plan.outputs.audio_chunks }}
      audio_matrix: ${{ steps.plan.outputs.audio_matrix }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20 with npm Cache
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install ffmpeg
        timeout-minutes: 8
        uses: ./.github/actions/ffmpeg

      - name: Check ffmpeg
        run: ffmpeg -version | head -1

      - name: Restore node_modules cache
        id: nm
        uses: actions/cache@v4
        with:
          path: node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Node Dependencies
        if: steps.nm.outputs.cache-hit != 'true'
        run: npm install --include=optional

      - name: Cache Remotion browser binary
        id: remotion-browser
        uses: actions/cache@v4
        with:
          path: node_modules/.remotion
          key: remotion-browser-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-v1

      - name: Ensure Remotion browser
        if: steps.remotion-browser.outputs.cache-hit != 'true'
        run: |
          for i in 1 2 3; do
            echo "Ensuring Remotion browser (attempt $i)..."
            npx remotion browser ensure && break || sleep 5
          done

      - name: Determine Render Arguments
        id: args
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PROJECT: ${{ inputs.project }}
          INPUT_BUNDLE_URL: ${{ inputs.bundle_url }}
          INPUT_RESOLUTION: ${{ inputs.resolution }}
          INPUT_DRAFT: ${{ inputs.draft }}
          INPUT_NO_BRANDING: ${{ inputs.no_branding }}
          INPUT_CHUNKS: ${{ inputs.chunks }}
          INPUT_PROGRESS_URL: ${{ inputs.progress_url }}
          INPUT_PROGRESS_TOKEN: ${{ inputs.progress_token }}
          INPUT_PUBLISH_URL: ${{ inputs.publish_url }}
          DISPATCH_PROJECT: ${{ github.event.client_payload.project }}
          DISPATCH_BUNDLE_URL: ${{ github.event.client_payload.bundle_url }}
          DISPATCH_RESOLUTION: ${{ github.event.client_payload.resolution }}
          DISPATCH_DRAFT: ${{ github.event.client_payload.draft }}
          DISPATCH_NO_BRANDING: ${{ github.event.client_payload.no_branding }}
          DISPATCH_CHUNKS: ${{ github.event.client_payload.chunks }}
          DISPATCH_PROGRESS_URL: ${{ github.event.client_payload.progress_url }}
          DISPATCH_PROGRESS_TOKEN: ${{ github.event.client_payload.progress_token }}
          DISPATCH_PUBLISH_URL: ${{ github.event.client_payload.publish_url }}
        run: |
          set +x
          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            PROJECT="$DISPATCH_PROJECT"
            BUNDLE_URL="$DISPATCH_BUNDLE_URL"
            RESOLUTION="${DISPATCH_RESOLUTION:-720}"
            DRAFT="${DISPATCH_DRAFT:-false}"
            NO_BRANDING="${DISPATCH_NO_BRANDING:-false}"
            CHUNKS="${DISPATCH_CHUNKS:-2}"
            PROGRESS_URL="$DISPATCH_PROGRESS_URL"
            PROGRESS_TOKEN="$DISPATCH_PROGRESS_TOKEN"
            PUBLISH_URL="$DISPATCH_PUBLISH_URL"
          else
            PROJECT="$INPUT_PROJECT"
            BUNDLE_URL="$INPUT_BUNDLE_URL"
            RESOLUTION="${INPUT_RESOLUTION:-720}"
            DRAFT="${INPUT_DRAFT:-false}"
            NO_BRANDING="${INPUT_NO_BRANDING:-false}"
            CHUNKS="${INPUT_CHUNKS:-2}"
            PROGRESS_URL="$INPUT_PROGRESS_URL"
            PROGRESS_TOKEN="$INPUT_PROGRESS_TOKEN"
            PUBLISH_URL="$INPUT_PUBLISH_URL"
          fi

          FLAGS="--project ${PROJECT} --resolution ${RESOLUTION} --concurrency 2"
          [ "$DRAFT" = "true" ] && FLAGS="$FLAGS --draft"
          [ "$NO_BRANDING" = "true" ] && FLAGS="$FLAGS --no-branding"

          printf 'project=%s\n' "$PROJECT" >> "$GITHUB_OUTPUT"
          printf 'bundle_url=%s\n' "$BUNDLE_URL" >> "$GITHUB_OUTPUT"
          printf 'render_flags=%s\n' "$FLAGS" >> "$GITHUB_OUTPUT"
          printf 'want_chunks=%s\n' "$CHUNKS" >> "$GITHUB_OUTPUT"
          printf 'progress_url=%s\n' "$PROGRESS_URL" >> "$GITHUB_OUTPUT"
          printf 'progress_token=%s\n' "$PROGRESS_TOKEN" >> "$GITHUB_OUTPUT"
          printf 'publish_url=%s\n' "$PUBLISH_URL" >> "$GITHUB_OUTPUT"

      - name: Fetch Dynamic Project Bundle if Provided
        if: steps.args.outputs.bundle_url != ''
        env:
          PROJECT: ${{ steps.args.outputs.project }}
          BUNDLE_URL: ${{ steps.args.outputs.bundle_url }}
        run: |
          set +x
          if [ -n "$BUNDLE_URL" ]; then echo "::add-mask::$BUNDLE_URL"; fi
          echo "📥 Fetching dynamic project bundle from the configured temporary URL..."
          mkdir -p "public/content/${PROJECT}"
          curl -fsSL "$BUNDLE_URL" -o bundle.tar.gz
          tar -xzf bundle.tar.gz -C "public/content/${PROJECT}"
          ls -la "public/content/${PROJECT}"

      - name: Generate Voiceover and Merge Audio if Bundle Has None
        if: steps.args.outputs.bundle_url != ''
        run: |
          PROJECT="${{ steps.args.outputs.project }}"
          if ls "public/content/${PROJECT}/audio/"*.mp3 >/dev/null 2>&1; then
            # The bundle carries its own narration (e.g. Voicebox): measure it and build the timeline and the merged
            # voiceover from it, without synthesising anything.
            echo "Narration already present in bundle: measuring and merging it (no TTS)."
            npm run longform:audio -- --project "${PROJECT}" --external
            npm run longform:merge -- --project "${PROJECT}"
          else
            pip install --user edge-tts
            export PATH="$HOME/.local/bin:$PATH"
            npm run longform:audio -- --project "${PROJECT}"
            npm run longform:merge -- --project "${PROJECT}"
          fi

      - name: Plan frame chunks
        id: plan
        run: |
          PROJECT="${{ steps.args.outputs.project }}"
          TOTAL=$(node -e "console.log(require('./public/content/${PROJECT}/video.json').totalFrames||0)")
          N=${{ steps.args.outputs.want_chunks }}
          case "$N" in ''|*[!0-9]*) N=2 ;; esac
          [ "$N" -lt 1 ] && N=2
          [ "$N" -gt 16 ] && N=16
          # A runner has ~60 s of set-up, so splitting pays off from ~450 frames (15 s of video): a 25 s "how it works" clip rendered on ONE
          # runner took 155 s of frames; on 2-3 runners it is about 60 s. (It used to wait for ~2800 frames per runner.)
          PER=450
          NEED=$(( (TOTAL + PER - 1) / PER ))
          [ "$NEED" -lt 1 ] && NEED=1
          [ "$N" -gt "$NEED" ] && N=$NEED
          MATRIX="[$(seq -s, 0 $((N-1)))]"
          echo "total frames=$TOTAL chunks=$N matrix=$MATRIX"
          echo "chunks=$N" >> "$GITHUB_OUTPUT"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          # the audio walk costs about as much runner time as the frames: slice it too, but keep the job count under GitHub's 20 concurrent runners
          A=$N; [ "$A" -gt 8 ] && A=8
          echo "audio_chunks=$A" >> "$GITHUB_OUTPUT"
          echo "audio_matrix=[$(seq -s, 0 $((A-1)))]" >> "$GITHUB_OUTPUT"

      - name: Upload prepared project (voiceover, audio track)
        uses: actions/upload-artifact@v4
        with:
          name: prep-${{ steps.args.outputs.project }}-${{ github.run_id }}
          path: public/content/${{ steps.args.outputs.project }}
          retention-days: 1

  # 2b) The composition's mixed audio track (voiceover + music + effects). It walks the
  # timeline without drawing frames, so it runs beside the frame chunks instead of before them.
  audio-track:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        chunk: ${{ fromJSON(needs.prepare.outputs.audio_matrix) }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20 with npm Cache
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Restore node_modules cache
        id: nm
        uses: actions/cache@v4
        with:
          path: node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Node Dependencies
        if: steps.nm.outputs.cache-hit != 'true'
        run: npm install --include=optional

      - name: Restore Remotion browser cache
        uses: actions/cache@v4
        with:
          path: node_modules/.remotion
          key: remotion-browser-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-v1

      - name: Download prepared project
        uses: actions/download-artifact@v4
        with:
          name: prep-${{ needs.prepare.outputs.project }}-${{ github.run_id }}
          path: public/content/${{ needs.prepare.outputs.project }}

      - name: Render the composition's audio track
        run: npx tsx scripts/longs/render.ts ${{ needs.prepare.outputs.render_flags }} --audio-chunk ${{ matrix.chunk }}/${{ needs.prepare.outputs.audio_chunks }}

      - name: Upload audio track
        uses: actions/upload-artifact@v4
        with:
          name: audio-${{ needs.prepare.outputs.project }}-${{ github.run_id }}-${{ matrix.chunk }}
          path: out/${{ needs.prepare.outputs.project }}.audio${{ matrix.chunk }}.wav
          retention-days: 1

  # 2) The frames, split across parallel runners.
  render-chunk:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: true
      matrix:
        chunk: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20 with npm Cache
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install ffmpeg
        timeout-minutes: 8
        uses: ./.github/actions/ffmpeg

      - name: Restore node_modules cache
        id: nm
        uses: actions/cache@v4
        with:
          path: node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Node Dependencies
        if: steps.nm.outputs.cache-hit != 'true'
        run: npm install --include=optional

      - name: Restore Remotion browser cache
        uses: actions/cache@v4
        with:
          path: node_modules/.remotion
          key: remotion-browser-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-v1

      - name: Download prepared project
        uses: actions/download-artifact@v4
        with:
          name: prep-${{ needs.prepare.outputs.project }}-${{ github.run_id }}
          path: public/content/${{ needs.prepare.outputs.project }}

      - name: Render frame chunk
        env:
          PROGRESS_URL: ${{ needs.prepare.outputs.progress_url }}
          PROGRESS_TOKEN: ${{ needs.prepare.outputs.progress_token }}
          PROJECT_SLUG: ${{ needs.prepare.outputs.project }}
          CHUNK_INDEX: ${{ matrix.chunk }}
          CHUNK_COUNT: ${{ needs.prepare.outputs.chunks }}
          RENDER_FLAGS: ${{ needs.prepare.outputs.render_flags }}
        run: |
          set +x
          if [ -n "$PROGRESS_URL" ]; then echo "::add-mask::$PROGRESS_URL"; fi
          if [ -n "$PROGRESS_TOKEN" ]; then echo "::add-mask::$PROGRESS_TOKEN"; fi
          if [ -n "$PROGRESS_URL" ] && [ -n "$PROGRESS_TOKEN" ]; then
            # Report "Rendered X/Y" every 10s without logging the temporary token or URL.
            (
              while true; do
                sleep 10
                L=$(tr '\r' '\n' < render.log 2>/dev/null | grep -o 'Rendered [0-9]*/[0-9]*' | tail -1)
                [ -n "$L" ] || continue
                D=${L#Rendered }; DONE=${D%/*}; TOTAL=${D#*/}
                payload=$(printf '{"slug":"%s","token":"%s","chunk":%s,"done":%s,"total":%s}' "$PROJECT_SLUG" "$PROGRESS_TOKEN" "$CHUNK_INDEX" "$DONE" "$TOTAL")
                curl -s -m 8 -X POST "$PROGRESS_URL" -H 'Content-Type: application/json' -d "$payload" >/dev/null || true
              done
            ) &
          fi
          npx tsx scripts/longs/render.ts $RENDER_FLAGS --chunk "$CHUNK_INDEX/$CHUNK_COUNT" 2>&1 | tee render.log

      - name: Upload chunk
        uses: actions/upload-artifact@v4
        with:
          name: chunk-${{ needs.prepare.outputs.project }}-${{ github.run_id }}-${{ matrix.chunk }}
          path: out/${{ needs.prepare.outputs.project }}.chunk${{ matrix.chunk }}.mp4
          retention-days: 1

  # 3) Join the (already branded) chunks + audio slices, QA.
  combine:
    needs: [prepare, audio-track, render-chunk]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20 with npm Cache
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install ffmpeg
        timeout-minutes: 8
        uses: ./.github/actions/ffmpeg

      - name: Check ffmpeg
        run: ffmpeg -version | head -1

      - name: Restore node_modules cache
        id: nm
        uses: actions/cache@v4
        with:
          path: node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Node Dependencies
        if: steps.nm.outputs.cache-hit != 'true'
        run: npm install --include=optional

      - name: Restore Remotion browser cache
        uses: actions/cache@v4
        with:
          path: node_modules/.remotion
          key: remotion-browser-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-v1

      - name: Download prepared project
        uses: actions/download-artifact@v4
        with:
          name: prep-${{ needs.prepare.outputs.project }}-${{ github.run_id }}
          path: public/content/${{ needs.prepare.outputs.project }}

      - name: Download chunks
        uses: actions/download-artifact@v4
        with:
          pattern: chunk-${{ needs.prepare.outputs.project }}-${{ github.run_id }}-*
          path: out
          merge-multiple: true

      - name: Download audio slices
        uses: actions/download-artifact@v4
        with:
          pattern: audio-${{ needs.prepare.outputs.project }}-${{ github.run_id }}-*
          path: out
          merge-multiple: true

      - name: Join, brand and QA
        run: npx tsx scripts/longs/render.ts ${{ needs.prepare.outputs.render_flags }} --combine ${{ needs.prepare.outputs.chunks }} --audio-chunks ${{ needs.prepare.outputs.audio_chunks }}

      - name: List Output Files
        run: ls -lh out/

      # Upload straight to YouTube from the runner so the dashboard VM never has to download and unpack
      # the video. Best effort: on any failure the mp4 is still uploaded as the artifact below.
      - name: Mask publishing credentials
        if: needs.prepare.outputs.publish_url != '' && needs.prepare.outputs.progress_token != ''
        env:
          PUBLISH_URL: ${{ needs.prepare.outputs.publish_url }}
          PUBLISH_TOKEN: ${{ needs.prepare.outputs.progress_token }}
        run: |
          if [ -n "$PUBLISH_URL" ]; then echo "::add-mask::$PUBLISH_URL"; fi
          if [ -n "$PUBLISH_TOKEN" ]; then echo "::add-mask::$PUBLISH_TOKEN"; fi

      - name: Publish to YouTube (token from dashboard)
        if: needs.prepare.outputs.publish_url != '' && needs.prepare.outputs.progress_token != ''
        continue-on-error: true
        timeout-minutes: 25
        env:
          PUBLISH_URL: ${{ needs.prepare.outputs.publish_url }}
          PUBLISH_TOKEN: ${{ needs.prepare.outputs.progress_token }}
        run: npx tsx scripts/longs/publish-youtube.ts --project "${{ needs.prepare.outputs.project }}"

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ needs.prepare.outputs.project }}-${{ github.run_number }}
          path: out/${{ needs.prepare.outputs.project }}.mp4
          retention-days: 14
